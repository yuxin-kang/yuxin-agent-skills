name: Daily robotics paper digest

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days to inspect on arXiv
        required: false
        default: "7"
      max_papers:
        description: Maximum new papers in the digest
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: daily-robotics-paper-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
      MAX_PAPERS: ${{ github.event.inputs.max_papers || '20' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch recent robotics papers
        run: |
          mkdir -p .cache reports data
          python3 skills/robotics-paper-digest/scripts/fetch_arxiv.py \
            --profile skills/robotics-paper-digest/references/default-profile.json \
            --state data/seen_arxiv_ids.json \
            --lookback-days "$LOOKBACK_DAYS" \
            --max-papers "$MAX_PAPERS" \
            --output .cache/papers.json

      - name: Render Chinese digest
        run: |
          python3 skills/robotics-paper-digest/scripts/render_digest.py \
            --input .cache/papers.json \
            --output "reports/$(date -u +%F).md" \
            --state data/seen_arxiv_ids.json \
            --index reports/README.md \
            --model "$OPENAI_MODEL" \
            --allow-extractive-fallback

      - name: Commit daily report
        run: |
          git config user.name "robotics-paper-bot"
          git config user.email "robotics-paper-bot@users.noreply.github.com"
          git add reports data/seen_arxiv_ids.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Add robotics paper digest $(date -u +%F)"
          git push
