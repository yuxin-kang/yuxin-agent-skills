name: Daily robotics paper digest

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days to inspect on arXiv (enter another value when needed)
        required: false
        default: "3"
        type: string
      max_papers:
        description: Maximum new papers in the digest
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: daily-robotics-paper-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
      MAX_PAPERS: ${{ github.event.inputs.max_papers || '20' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch recent robotics papers
        run: |
          runtime_dir="$RUNNER_TEMP/robotics-paper-digest"
          mkdir -p "$runtime_dir"
          printf '{"seen": [], "updated_at": null}\n' > "$runtime_dir/seen.json"
          python3 robotics-paper-digest/scripts/fetch_arxiv.py \
            --profile robotics-paper-digest/references/default-profile.json \
            --state "$runtime_dir/seen.json" \
            --lookback-days "$LOOKBACK_DAYS" \
            --max-papers "$MAX_PAPERS" \
            --output "$runtime_dir/papers.json"

      - name: Render Chinese digest
        run: |
          runtime_dir="$RUNNER_TEMP/robotics-paper-digest"
          python3 robotics-paper-digest/scripts/render_digest.py \
            --input "$runtime_dir/papers.json" \
            --output "$runtime_dir/report.md" \
            --state "$runtime_dir/seen.json" \
            --model "$OPENAI_MODEL" \
            --allow-extractive-fallback

      - name: Show digest in the run summary
        run: |
          cat "$RUNNER_TEMP/robotics-paper-digest/report.md" >> "$GITHUB_STEP_SUMMARY"
